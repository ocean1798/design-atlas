<!doctype html><html lang="zh-CN" data-skin="bento" data-themed="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Bento</title>
<link rel="stylesheet" href="fonts.css"><style>
:root{--bg:#07071a;--well:rgba(0,0,0,.3);--drb:rgba(14,14,34,.88);--t:#eef0ff;--m:#9aa0c3;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--a:#a78bfa;--b:#22d3ee;--c:#f472b6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);transition:background .5s,color .5s;color:var(--t);font:14px/1.5 Inter,"PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100vh;overflow-x:hidden}
.aur{position:fixed;inset:-20%;z-index:-1;filter:blur(90px) saturate(1.3);opacity:.7}
.aur i{position:absolute;border-radius:50%;animation:fl 22s ease-in-out infinite alternate}
.aur i:nth-child(1){width:50vw;height:50vw;background:#5b21b6;left:5%;top:0}.aur i:nth-child(2){width:40vw;height:40vw;background:#0e7490;right:5%;top:15%;animation-duration:28s}.aur i:nth-child(3){width:35vw;height:35vw;background:#be185d;left:35%;top:45%;animation-duration:34s;opacity:.7}
@keyframes fl{to{transform:translate(8vw,6vh) scale(1.2)}}
.wrap{max-width:1360px;margin:0 auto;padding:22px 28px 80px}
nav{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{font:600 18px Inter;letter-spacing:-.02em;display:flex;gap:9px;align-items:center}.logo i{width:24px;height:24px;border-radius:8px;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));box-shadow:0 0 20px var(--a)}
nav .sp{flex:1}.pill{border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);border-radius:999px;padding:7px 15px;color:var(--t);font:13px Inter,"PingFang SC";cursor:pointer;transition:all .2s}.pill:hover,.pill.on{background:var(--pon);border-color:var(--pbd)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--bd);border-radius:26px;backdrop-filter:blur(22px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px -30px rgba(0,0,0,.6);position:relative;overflow:hidden}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:180px 170px 190px;gap:14px}
.b-title{grid-column:1/4;grid-row:1/3;padding:30px 32px;display:flex;flex-direction:column;justify-content:space-between}
.b-title h1{margin:0;font:600 64px/1.02 Inter,"PingFang SC";letter-spacing:-.045em}.b-title h1 em{font:italic 400 72px Disp,serif;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent;letter-spacing:-.02em}
.b-title p{color:var(--m);max-width:440px;margin:0;font-size:15px}
.tag{font:11px Mono;color:var(--b);text-transform:uppercase;letter-spacing:.12em}
.stat{padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between}.stat b{font:600 54px/1 Inter;letter-spacing:-.05em}.stat span{color:var(--m);font-size:12.5px}
.s1{grid-column:4/5;grid-row:1}.s2{grid-column:4/5;grid-row:2}
.car{grid-column:5/7;grid-row:1/3;perspective:1100px;display:grid;place-items:center}
.ring{position:relative;width:200px;height:150px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.ring .fc{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#111;border:1px solid var(--bd);cursor:pointer;backface-visibility:hidden;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}
.ring img{width:100%;height:100%;object-fit:cover}.ring .fc span{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-weight:600;font-size:13px}
.car .tag{position:absolute;top:18px;left:20px}.car .ctl{position:absolute;bottom:14px;display:flex;gap:8px}.car .ctl button{width:32px;height:32px}
.srch{grid-column:1/4;grid-row:3;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.sb{display:flex;align-items:center;gap:12px;background:var(--well);border:1px solid var(--bd);border-radius:18px;padding:4px 6px 4px 18px}.sb:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(167,139,250,.2)}
.sb input{flex:1;background:none;border:0;outline:none;color:var(--t);font:17px Inter,"PingFang SC";padding:12px 0}.sb kbd{font:11px Mono;color:var(--m);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;margin-right:8px}
.cb{grid-column:4/7;grid-row:3;padding:20px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;align-content:center}
.cb button{display:grid;grid-template-columns:1fr auto;gap:4px;background:none;border:0;color:var(--t);font:12.5px Inter,"PingFang SC";cursor:pointer;text-align:left;padding:3px 0}.cb button i{font:11px Mono;font-style:normal;color:var(--m)}
.cb button s{grid-column:1/-1;height:3px;border-radius:2px;background:var(--bd);text-decoration:none;overflow:hidden}.cb button s u{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));text-decoration:none}
.cb button.on{color:var(--b)}
h2{font:600 26px Inter,"PingFang SC";letter-spacing:-.03em;margin:48px 0 16px;display:flex;align-items:baseline;gap:12px}h2 small{font:12px Mono;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;perspective:1000px}
.card{border-radius:20px;cursor:pointer;transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .3s;will-change:transform}
.card .im{aspect-ratio:16/10;overflow:hidden;border-radius:20px 20px 0 0;background:var(--well)}.card img.p{width:100%;height:100%;object-fit:cover;transform:translateZ(0)}
.card .ph{height:100%;display:grid;place-items:center;font:600 46px Inter;letter-spacing:-.05em}
.card .c{padding:12px 16px 16px;transform:translateZ(30px)}.card b{font-weight:600}.card p{margin:4px 0 0;color:var(--m);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .r{display:flex;align-items:center;gap:8px}.card .r img{width:18px;height:18px;border-radius:5px;background:#fff}.card .r em{margin-left:auto;font:10.5px Mono;font-style:normal;color:var(--m)}
.card .badge{position:absolute;top:12px;left:12px;font-size:10.5px;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid var(--bd);transform:translateZ(40px)}
.card .gl{position:absolute;inset:0;pointer-events:none;border-radius:20px;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.18),transparent 45%);opacity:0;transition:opacity .3s}.card:hover .gl{opacity:1}
.card:hover{box-shadow:0 40px 60px -30px rgba(120,80,255,.55)}
.more{display:block;margin:24px auto 0}
.dr{background:var(--drb);backdrop-filter:blur(30px);border-left:1px solid var(--bd);color:var(--t)}.dph{background:linear-gradient(135deg,var(--a),var(--b));font:600 80px Inter}
.dr h2{margin:6px 0;font-size:40px;display:block}.dk{font:11px Mono;color:var(--b);text-transform:uppercase}.dd,.do,.dm{color:var(--m)}.dzh{font-weight:600}
.da>*{border:1px solid var(--bd);background:var(--gl);color:var(--t);border-radius:14px;padding:10px 16px;font:13px Inter,"PingFang SC"}.da .go{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#0b0b20;font-weight:600}
.dx{border:1px solid var(--bd);background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:36px;height:36px}.toast{background:#fff;color:#000;border-radius:12px}

:root{--pon:rgba(255,255,255,.16);--pbd:rgba(255,255,255,.3)}
[data-theme=light]{--bg:#eef0fa;--well:rgba(255,255,255,.6);--drb:rgba(250,250,255,.9);--t:#16163a;--m:#5d6288;--gl:rgba(255,255,255,.55);--bd:rgba(30,30,90,.12);--a:#7c3aed;--b:#0891b2;--c:#db2777;--pon:rgba(124,58,237,.12);--pbd:rgba(124,58,237,.35)}
[data-theme=light] .aur{opacity:.35}[data-theme=light] .glass{background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.4));box-shadow:inset 0 1px 0 #fff,0 30px 60px -34px rgba(40,40,120,.35)}
[data-theme=light] .card:hover{box-shadow:0 40px 60px -30px rgba(124,58,237,.4)}[data-theme=light] .card .gl{background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.7),transparent 45%)}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:40px 0 0}.bar2 .pill{font-size:12px;padding:5px 12px}.bar2 .pill.tg.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent}.bar2 i{font-style:normal;opacity:.55;margin-left:4px;font-size:11px}
.bar2 .lab{font:11px Mono;color:var(--m);text-transform:uppercase;letter-spacing:.1em;margin-right:4px}h2{margin-top:22px}
.cb{padding:12px 22px;gap:0 18px}.cb button{padding:1px 0;font-size:12px;gap:2px}
</style></head><body><div class="aur"><i></i><i></i><i></i></div><div class="wrap">
<nav><span class="logo"><i></i>Atlas</span><span class="sp"></span><button class="pill on" data-t="tool">工具</button><button class="pill" data-t="person">人物</button><button class="pill" data-t="fav">收藏</button><button class="pill" id="rnd">✦ 随机</button></nav>
<section class="bento">
<div class="glass b-title"><span class="tag">Design & Dev Atlas · 2026</span><h1>好工具，<br>值得被 <em>看见</em>.</h1><p>精选设计与开发工具、组件库、AI 智能体和创作者，一张离线的玻璃仪表盘。</p></div>
<div class="glass stat s1"><span class="tag">Tools</span><b id="n1"></b><span>件工具 · <span id="n4"></span> 免费/开源</span></div>
<div class="glass stat s2"><span class="tag">People</span><b id="n2"></b><span>位创作者 · <span id="n3"></span> 个分类</span></div>
<div class="glass car"><span class="tag">Featured · 3D</span><div class="ring" id="ring"></div><div class="ctl"><button class="pill" id="pv">‹</button><button class="pill" id="nx">›</button></div></div>
<div class="glass srch"><span class="tag">Search · 按 / 聚焦</span><label class="sb"><input id="q" placeholder="搜索工具、简介、域名…" autocomplete="off"><kbd>/</kbd></label></div>
<div class="glass cb" id="cb"></div></section>
<div class="bar2"><span class="lab">Sort</span><button class="pill" data-s="cat">分类</button><button class="pill" data-s="az">A–Z</button><span class="lab" style="margin-left:14px">Tags</span><span id="tgs" style="display:contents"></span></div><h2 id="ttl"></h2><div class="grid" id="grid"></div><button class="pill more" id="more" hidden>加载更多</button></div>
<script src="data.js"></script><script src="common.js"></script><script>
const T=D.filter(x=>!x.p);$('#n1').textContent=T.length;$('#n2').textContent=D.length-T.length;$('#n3').textContent=CATS.length;$('#n4').textContent=T.filter(x=>x.oss).length;
let lim=40;const mx=Math.max(...CATS.map(c=>T.filter(x=>x.c===c).length));
function cb(){$('#cb').innerHTML=[...CATS].sort((a,b)=>T.filter(x=>x.c===b).length-T.filter(x=>x.c===a).length).slice(0,18).map(c=>{const n=T.filter(x=>x.c===c).length;return `<button class="${ST.cat===c?'on':''}" data-c="${esc(c)}"><span>${esc(CN[c])}</span><i>${n}</i><s><u style="width:${n/mx*100}%"></u></s></button>`}).join('')}
const F=T.filter(x=>x.img&&(x.sp||x.oss)).slice(0,10),N=F.length,R=Math.round(120/Math.tan(Math.PI/N));let rot=0;
$('#ring').innerHTML=F.map((x,i)=>`<div class="fc" data-u="${esc(x.u)}" style="transform:rotateY(${i*360/N}deg) translateZ(${R}px)"><img src="${x.img}" alt=""><span>${esc(x.n)}</span></div>`).join('');
const spin=d=>{rot+=d*360/N;$('#ring').style.transform=`translateZ(${-R}px) rotateY(${rot}deg)`};spin(0);let auto=setInterval(()=>spin(-1),2800);
$('#nx').onclick=()=>{clearInterval(auto);spin(-1)};$('#pv').onclick=()=>{clearInterval(auto);spin(1)};
$('#ring').onclick=e=>{const f=e.target.closest('.fc');if(f)openDrawer(D.find(x=>x.u===f.dataset.u))};
function grid(){saveST();const r=results();
 $$('nav [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===ST.tab));$$('.bar2 [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===ST.sort));
 $('#tgs').innerHTML=tagCounts().map(([t,n])=>`<button class="pill tg ${ST.tags.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}<i>${n}</i></button>`).join('');
 $('#ttl').innerHTML=`${ST.tab==='person'?'人物':ST.tab==='fav'?'我的收藏':ST.cat?esc(CN[ST.cat]):'全部工具'} <small>${r.length} items${ST.cat?' · 再次点击分类取消':''}</small>`;
 $('#grid').innerHTML=r.slice(0,lim).map(x=>`<article class="glass card" data-u="${esc(x.u)}">${x.sp?'<span class="badge">赞助</span>':x.oss?'<span class="badge">免费/开源</span>':''}<div class="im">${x.img?`<img class="p" loading="lazy" src="${x.img}" alt="">`:`<div class="ph" style="background:linear-gradient(135deg,${x.col},#1e1b4b);color:#fff">${esc(ini(x.n))}</div>`}</div><div class="c"><div class="r">${x.fav?`<img src="${x.fav}" loading="lazy" alt="">`:''}<b>${FAV.has(x.u)?'★ ':''}${esc(x.n)}</b><em>${esc(x.dom)}</em></div><p>${esc(x.zh)} · ${esc(x.d)}</p></div><span class="gl"></span></article>`).join('')||'<p style="color:var(--m)">没有匹配的结果</p>';
 $('#more').hidden=r.length<=lim;cb()}
$('#grid').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const b=c.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;c.style.transform=`rotateX(${(.5-py)*10}deg) rotateY(${(px-.5)*12}deg) translateZ(6px)`;c.style.setProperty('--x',px*100+'%');c.style.setProperty('--y',py*100+'%')});
$('#grid').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openDrawer(D.find(x=>x.u===c.dataset.u))};
$('#cb').onclick=e=>{const b=e.target.closest('button');if(!b)return;ST.cat=ST.cat===b.dataset.c?null:b.dataset.c;ST.tab='tool';lim=40;grid();$('#ttl').scrollIntoView({behavior:'smooth',block:'center'})};
$('.bar2').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.s)ST.sort=b.dataset.s;else toggleTag(b.dataset.t);lim=40;grid()};
$$('nav [data-t]').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;ST.cat=null;ST.tags=[];lim=40;grid()});
$('#rnd').onclick=()=>openDrawer(randomPick());$('#more').onclick=()=>{lim+=40;grid()};$('#q').value=ST.q;$('#q').oninput=()=>{ST.q=$('#q').value;lim=40;grid()};
document.addEventListener('fav',grid);grid();
</script></body></html>
