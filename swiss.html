<!doctype html><html lang="zh-CN" data-skin="swiss" data-themed="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS — 设计工具海报</title>
<link rel="stylesheet" href="fonts.css"><style>
:root{--r:#ff2a00;--k:#0a0a0a;--w:#f4f2ee;--hv:#fff}[data-theme=dark]{--k:#f1eee8;--w:#0d0d0d;--hv:#1a1a1a}body{transition:background .4s,color .4s}
*{box-sizing:border-box}body{margin:0;background:var(--w);color:var(--k);font:15px/1.4 Inter,"PingFang SC","Noto Sans CJK SC",Helvetica,sans-serif;letter-spacing:-.01em}
.g{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:3px solid var(--k)}
.hd{padding:18px 24px;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;border-bottom:3px solid var(--k)}
.hd span:nth-child(2){color:var(--r)}
.hero{grid-template-columns:repeat(12,1fr);min-height:600px}
.h1{grid-column:1/9;padding:20px 24px 24px;border-right:3px solid var(--k);display:flex;flex-direction:column;justify-content:space-between}
.h1 h1{margin:0;font:900 clamp(120px,15vw,250px)/.78 Inter,sans-serif;letter-spacing:-.075em}.h1 h1 span{color:var(--r)}
.h1 .zh{font:900 64px/1 "PingFang SC","Noto Sans CJK SC",sans-serif;letter-spacing:-.04em;margin-top:18px}
.h1 p{max-width:520px;font-size:17px;margin:24px 0 0;font-weight:500}
.h2{grid-column:9/13;display:grid;grid-template-rows:1fr 1fr 1fr}
.h2 div{border-bottom:3px solid var(--k);padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-end}.h2 div:last-child{border:0;background:var(--r);color:var(--w)}
.h2 b{font:900 112px/.8 Inter;letter-spacing:-.07em}.h2 small{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;text-align:right}
.mq{overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--k);background:var(--k);color:var(--w);font:800 34px/1 Inter;padding:14px 0;letter-spacing:-.03em}
.mq.alt{background:var(--w);color:var(--k);font-size:20px;padding:10px 0}
.mq div{display:inline-block;animation:m 80s linear infinite}.mq.alt div{animation-duration:120s;animation-direction:reverse}.mq i{color:var(--r);font-style:normal;margin:0 24px}
@keyframes m{to{transform:translateX(-50%)}}
.srch{display:flex;border-bottom:3px solid var(--k)}.srch label{background:var(--r);color:var(--w);font:900 64px/1 Inter;padding:14px 26px}
.srch input{flex:1;border:0;outline:none;background:none;font:800 64px/1 Inter,"PingFang SC";letter-spacing:-.04em;padding:14px 24px;color:var(--k)}.srch input::placeholder{color:#c9c5bd}
.srch span{align-self:center;padding:0 24px;font-weight:700;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:3px solid var(--k)}
.cat{border:0;border-right:3px solid var(--k);border-bottom:3px solid var(--k);background:var(--w);text-align:left;padding:14px 16px 12px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,color .15s;font-family:inherit;color:var(--k)}
.cat:nth-child(6n){border-right:0}.cat b{font:900 72px/.8 Inter;letter-spacing:-.06em}.cat span{font-weight:800;font-size:15px}.cat small{display:block;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.6}
.cat:nth-child(5n+2){background:var(--k);color:var(--w)}.cat:nth-child(7n+4){background:var(--r);color:var(--w)}
.cat:hover,.cat.on{background:var(--r)!important;color:var(--w)!important}.cat.on b:after{content:" ●"}
.bar{display:flex;justify-content:space-between;align-items:flex-end;padding:24px 24px 18px;border-bottom:3px solid var(--k)}.bar h2{margin:0;font:900 96px/.8 Inter,"PingFang SC";letter-spacing:-.06em}.bar h2 span{color:var(--r)}
.bar .t{display:flex;gap:0}.bar button{border:3px solid var(--k);background:var(--w);font:800 13px Inter,"PingFang SC";padding:10px 16px;cursor:pointer;margin-left:-3px;color:var(--k)}.bar button.on{background:var(--k);color:var(--w)}
.list{display:grid;grid-template-columns:repeat(4,1fr)}
.it{border-right:3px solid var(--k);border-bottom:3px solid var(--k);cursor:pointer;position:relative;background:var(--w);transition:background .15s}
.it:nth-child(4n){border-right:0}.it .n{font:900 13px Mono;padding:10px 14px 0;display:flex;justify-content:space-between}.it .n em{color:var(--r);font-style:normal}
.it .im{aspect-ratio:4/3;margin:10px 14px;overflow:hidden;background:var(--k);position:relative}.it img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);transition:filter .3s,transform .5s;mix-blend-mode:normal}
.it:hover img{filter:none;transform:scale(1.04)}.it .ph{height:100%;display:grid;place-items:center;font:900 90px/1 Inter;letter-spacing:-.06em;color:var(--w)}
.it:nth-child(3n) .ph{background:var(--r)}
.it h3{margin:0;padding:0 14px;font:900 30px/1 Inter;letter-spacing:-.04em;word-break:break-word}.it p{margin:8px 14px 14px;font-size:13px;font-weight:500}
.it:hover{background:var(--hv)}.it:hover h3{color:var(--r)}
.empty{padding:80px 24px;font:900 64px Inter;letter-spacing:-.04em}
.more{display:block;width:100%;border:0;background:var(--k);color:var(--w);font:900 40px Inter;padding:24px;cursor:pointer;letter-spacing:-.03em}.more:hover{background:var(--r)}
footer{padding:24px;font-weight:700;font-size:12px;text-transform:uppercase;display:flex;justify-content:space-between}
.dr{background:var(--w);border-left:3px solid var(--k)}.dimg img{filter:grayscale(1) contrast(1.1)}.dph{background:var(--r);color:var(--w);font:900 120px Inter}
.dr h2{font:900 64px/.85 Inter;letter-spacing:-.06em;margin:10px 0 16px}.dk{font-weight:800;text-transform:uppercase;font-size:12px;color:var(--r)}.dzh{font-weight:800;font-size:18px}
.da>*{border:3px solid var(--k);background:var(--w);font:800 14px Inter,"PingFang SC";padding:12px 18px;color:var(--k);margin-left:-3px}.da .go{background:var(--r);color:var(--w)}.dx{border:3px solid var(--k);background:var(--w);font:900 16px Inter;width:42px;height:42px}
.toast{background:var(--k);color:var(--w);font-weight:800}
.tgs{display:flex;flex-wrap:wrap;border-bottom:3px solid var(--k)}.tgs button{border:0;border-right:3px solid var(--k);background:var(--w);color:var(--k);font:800 13px Inter,"PingFang SC";padding:10px 16px;cursor:pointer}.tgs button i{font-style:normal;font-weight:600;opacity:.5;margin-left:6px}.tgs button.on{background:var(--k);color:var(--w)}.tgs span{padding:10px 16px;font:900 13px Inter;color:var(--r);border-right:3px solid var(--k)}
.cat[hidden]{display:none}</style></head><body>
<div class="hd"><span>Atlas / Index of Tools</span><span>No. 03 — 2026</span><span>设计 · 开发 · 资源</span><span>Offline Edition</span></div>
<section class="g hero"><div class="h1"><div><h1>Tools<span>.</span><br>Index</h1><div class="zh">设计工具总索引</div></div><p>一份为设计工程师整理的工具与人物目录。按分类浏览，或直接在下面输入关键词。点击任意条目查看详情。</p></div>
<div class="h2"><div><b id="s1"></b><small>件工具<br>Tools</small></div><div><b id="s2"></b><small>个分类<br>Categories</small></div><div><b id="s3"></b><small>位创作者<br>People</small></div></div></section>
<div class="mq"><div id="mq1"></div></div><div class="mq alt"><div id="mq2"></div></div>
<div class="srch"><label for="q">→</label><input id="q" placeholder="搜索 Search" autocomplete="off"><span>按 / 聚焦</span></div>
<div class="cats" id="cats"></div><div class="tgs" id="tgs"></div>
<div class="bar"><h2 id="tt"></h2><div class="t"><button data-t="tool" class="on">工具</button><button data-t="person">人物</button><button data-t="fav">收藏</button><button data-s="cat">分类</button><button data-s="az">A–Z</button><button id="rnd">随机</button></div></div>
<div class="list" id="list"></div><div id="mo"></div>
<footer><span>Atlas Tools Index</span><span>Set in Inter Black</span><span>↑ 回到顶部</span></footer>
<script src="data.js"></script><script src="common.js"></script><script>
let lim=48;const T=D.filter(x=>!x.p);$('#s1').textContent=T.length;$('#s2').textContent=CATS.length;$('#s3').textContent=D.length-T.length;
const names=T.map(x=>esc(x.n));$('#mq1').innerHTML=(names.slice(0,60).join('<i>✦</i>')+'<i>✦</i>').repeat(2);$('#mq2').innerHTML=(CATS.map(c=>esc(CN[c])+' '+esc(c)).join('<i>/</i>')+'<i>/</i>').repeat(4);
function cats(){const cs=[...CATS].sort((a,b)=>T.filter(x=>x.c===b).length-T.filter(x=>x.c===a).length);$('#cats').style.display=ST.tab==='tool'?'':'none';
 $('#cats').innerHTML=`<button class="cat ${!ST.cat?'on':''}" data-c=""><b>${T.length}</b><span>全部<small>All</small></span></button>`+cs.map(c=>`<button class="cat ${ST.cat===c?'on':''}" data-c="${esc(c)}"><b>${T.filter(x=>x.c===c).length}</b><span>${esc(CN[c])}<small>${esc(c)}</small></span></button>`).join('');
 $('#tgs').innerHTML='<span>标签 TAGS</span>'+tagCounts().map(([t,n])=>`<button class="${ST.tags.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}<i>${n}</i></button>`).join('')}
function list(){saveST();const r=results();
 $$('.bar [data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===ST.tab));$$('.bar [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===ST.sort));
 $('#tt').innerHTML=(ST.tab==='person'?'人物':ST.tab==='fav'?'收藏':ST.cat?esc(CN[ST.cat]):'全部')+'<span>/</span>'+r.length;
 $('#list').innerHTML=r.length?r.slice(0,lim).map((x,i)=>`<article class="it" data-u="${esc(x.u)}"><div class="n"><span>${String(i+1).padStart(3,'0')}${FAV.has(x.u)?' ★':''}</span><em>${x.sp?'赞助':x.oss?'开源':''}</em></div><div class="im">${x.img?`<img loading="lazy" src="${x.img}" alt="">`:`<div class="ph">${esc(ini(x.n))}</div>`}</div><h3>${esc(x.n)}</h3><p>${esc(x.zh)}<br><span style="opacity:.55">${esc(x.dom)}</span></p></article>`).join(''):'<div class="empty" style="grid-column:1/-1">无结果。</div>';
 $('#mo').innerHTML=r.length>lim?`<button class="more" id="more">更多 +${r.length-lim}</button>`:'';cats()}
$('#cats').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;ST.cat=b.dataset.c||null;lim=48;list();$('.bar').scrollIntoView({behavior:'smooth'})};
$('#tgs').onclick=e=>{const b=e.target.closest('button');if(b){toggleTag(b.dataset.t);lim=48;list()}};
$('.bar .t').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='rnd')return openDrawer(randomPick());if(b.dataset.s)ST.sort=b.dataset.s;else{ST.tab=b.dataset.t;ST.cat=null;ST.tags=[]}lim=48;list()};
$('#list').onclick=e=>{const a=e.target.closest('.it');if(a)openDrawer(D.find(x=>x.u===a.dataset.u))};
$('#mo').onclick=e=>{if(e.target.id==='more'){lim+=48;list()}};$('#q').value=ST.q;$('#q').oninput=()=>{ST.q=$('#q').value;lim=48;list()};
document.addEventListener('fav',list);$('footer span:last-child').onclick=()=>scrollTo({top:0,behavior:'smooth'});list();
</script></body></html>
